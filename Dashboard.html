<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Connect — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <div class="brand"><span class="dot"></span>Campus Connect</div>
    <nav class="navlinks">
        <a class="nav" href="Home.html">Home</a>
        <a class="nav" href="Dashboard.html">Dashboard</a>
        <a class="nav" href="Courses.html">Courses</a>
        <a class="nav">Attendance</a>
        <a class="nav">Results</a>
        <a class="nav" href="Login.html">Logout</a>
    </nav>
</div>

<div class="page-head" id="profile">
    <h2 style="text-align:left;margin-left:0;">Academic Summary</h2>
</div>

<table>
<tr>
<th>Subject</th>
<th>Attendance</th>
<th>Marks</th>
</tr>
<tr>
<td>Python</td>
<td>90%</td>
<td class="grade-good">88</td>
</tr>
<tr>
<td>Java</td>
<td>86%</td>
<td class="grade-good">84</td>
</tr>
<tr>
<td>DBMS</td>
<td>93%</td>
<td class="grade-good">91</td>
</tr>
</table>

<div class="section">
    <h2 style="text-align:left;margin-left:0;">Enrolled Courses</h2>
</div>

<ul id="courseList"></ul>

<script src="app.js"></script>
<script>

function renderEnrolled(){
    const courses = getEnrolledCourses();
    const list = document.getElementById("courseList");
    list.innerHTML = "";

    if(courses.length === 0){
        list.innerHTML = "<li>No courses enrolled yet — visit the Courses page to get started.</li>";
        return;
    }

    courses.forEach(function(courseName){
        const meta = COURSES.find(c => c.id === courseName);
        const total = meta ? meta.steps.length : 0;
        const pct = courseProgressPercent(courseName, total);

        const li = document.createElement("li");
        li.innerHTML = `
            <div style="display:flex;justify-content:space-between;font-weight:600;">
                <span>${courseName}</span>
                <span>${pct}%</span>
            </div>
            <div class="progress-mini"><span style="width:${pct}%;"></span></div>
        `;
        list.appendChild(li);
    });
}

renderEnrolled();

const courses = getEnrolledCourses();
if(courses.length > 0){
    const allDone = courses.every(function(c){
        const meta = COURSES.find(m => m.id === c);
        return meta && courseProgressPercent(c, meta.steps.length) === 100;
    });
    if(allDone){
        showToast("All enrolled courses complete — great work!", "success");
    }
}
</script>

</body>
</html>
