<script>
document.getElementById("libraryCard").addEventListener("click", function(){
    showToast("Library module coming soon.", "info");
});
document.getElementById("assignmentsCard").addEventListener("click", function(){
    showToast("Assignments module coming soon.", "info");
});

document.addEventListener("DOMContentLoaded", function(){
    const hour = new Date().getHours();
    let timeGreeting = "Hello";
    if(hour < 12) timeGreeting = "Good morning";
    else if(hour < 18) timeGreeting = "Good afternoon";
    else timeGreeting = "Good evening";

    const user = getCurrentUser();
    const firstName = user ? user.name.split(" ")[0] : "Shakthi";

    document.getElementById("greeting").textContent = timeGreeting + ", " + firstName + "!";

    const courses = getEnrolledCourses();
    if(courses.length === 0){
        showToast("You're not enrolled in any courses yet — check out Courses.", "info", 4000);
    }else{
        showToast("You have " + courses.length + " course" + (courses.length > 1 ? "s" : "") + " in progress.", "success", 3500);
    }
});
</script>
